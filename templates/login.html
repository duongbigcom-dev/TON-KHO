{% extends "base.html" %}

{% block title %}Đăng Nhập - QUẢN LÝ TỒN KHO BIGCOM{% endblock %}

{% block login_content %}
<div class="max-w-md w-full bg-white p-7 rounded-2xl border border-slate-300 shadow-xl">
  
  <!-- Logo Bigcom Đỏ -->
  <div class="text-center mb-6">
    <div class="p-3 mb-2 flex items-center justify-center">
      <img src="{{ url_for('static', filename='images/logo_bigcom.png') }}" alt="BIGCOM M&E" class="h-14 w-auto object-contain mx-auto">
    </div>
    <h2 class="text-base font-black text-slate-800 tracking-tight uppercase">QUẢN LÝ TỒN KHO BIGCOM</h2>
    <p class="text-[11px] text-slate-500 mt-0.5">Dự Án Đồng Hòa - Hệ Thống Đồng Bộ Công Trường ⇄ Văn Phòng</p>
  </div>

  <form method="POST" action="{{ url_for('login_view') }}" class="space-y-3.5">
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Tên đăng nhập</label>
      <input type="text" name="username" id="usernameInput" required placeholder="admin / ketoan / thukho / viewer" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#ed3237] text-slate-900 font-medium">
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Mật khẩu</label>
      <input type="password" name="password" id="passwordInput" required placeholder="Nhập mật khẩu" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#ed3237] text-slate-900 font-medium">
    </div>

    <button type="submit" class="w-full py-2.5 px-4 bg-[#ed3237] hover:bg-[#c9252a] text-white rounded-lg font-bold text-xs transition-colors shadow-md flex items-center justify-center gap-1.5 mt-2">
      <span>🔐</span> Đăng Nhập Hệ Thống Bigcom
    </button>
  </form>

  <!-- Quick Login Demo Buttons -->
  <div class="mt-5 pt-4 border-t border-slate-200">
    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Chọn nhanh tài khoản kiểm thử:</p>
    <div class="grid grid-cols-2 gap-2 text-xs">
      <button type="button" onclick="fillLogin('admin', 'admin123')" class="p-2 border border-purple-200 bg-purple-50 hover:bg-purple-100 rounded-lg text-left text-purple-900 transition-colors">
        <div class="font-bold">👑 Admin</div>
        <div class="text-[10px] text-purple-600">Toàn quyền hệ thống</div>
      </button>

      <button type="button" onclick="fillLogin('ketoan', 'ketoan123')" class="p-2 border border-blue-200 bg-blue-50 hover:bg-blue-100 rounded-lg text-left text-blue-900 transition-colors">
        <div class="font-bold">💼 Kế Toán</div>
        <div class="text-[10px] text-blue-600">Xem giá, chi phí, HĐ</div>
      </button>

      <button type="button" onclick="fillLogin('thukho', 'thukho123')" class="p-2 border border-red-200 bg-red-50 hover:bg-red-100 rounded-lg text-left text-red-900 transition-colors">
        <div class="font-bold">🏗️ Thủ Kho</div>
        <div class="text-[10px] text-red-600">Nhập/xuất, scan PDF</div>
      </button>

      <button type="button" onclick="fillLogin('viewer', 'viewer123')" class="p-2 border border-slate-200 bg-slate-50 hover:bg-slate-100 rounded-lg text-left text-slate-900 transition-colors">
        <div class="font-bold">👁️ Chỉ Xem</div>
        <div class="text-[10px] text-slate-500">Xem tồn kho tổ đội</div>
      </button>
    </div>
  </div>

</div>

<script>
  function fillLogin(u, p) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('passwordInput').value = p;
  }
</script>
{% endblock %}
